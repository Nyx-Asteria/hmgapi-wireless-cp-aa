# The mod's CI: HMG-API's mod workflow (floor and hook points, build, tests, script check,
# packages with a throwaway key), pinned to the same HMG-API as hmgapi-sdk.json.
# Until HMG-API 1.0.3 carries the SDK, both are a HMG-API commit SHA; from 1.0.3, the
# release (@v1.0.3 here, {"version", "sha256"} there). Change them together.
name: CI

on:
  push:
    branches: [main, k5-log2-cleanup]
  pull_request:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/check-pin.py

  mod:
    uses: ./.github/workflows/mod-source-floor.yml

  journal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - name: Production session journal regression
        run: python3 wireless-carplay-aa/tests/session_journal_test.py

      - name: Native session USB export regression
        run: python3 wireless-carplay-aa/tests/session_export_test.py

      - name: CPUL-derived session log policy regression
        run: |
          mkdir -p out/log-policy
          javac --release 8 -d out/log-policy wireless-carplay-aa/src/hmgapi/mods/wireless/dipo/SessionLogPolicy.java wireless-carplay-aa/src/hmgapi/mods/wireless/dipo/PreSessionEvents.java wireless-carplay-aa/tests/SessionLogPolicyTest.java
          java -cp out/log-policy hmgapi.mods.wireless.dipo.SessionLogPolicyTest

      - name: Java session export regression
        run: |
          mkdir -p out/session-export
          javac --release 8 -d out/session-export wireless-carplay-aa/src/hmgapi/mods/sessionexport/SessionExporter.java wireless-carplay-aa/tests/SessionExporterTest.java
          java -cp out/session-export hmgapi.mods.sessionexport.SessionExporterTest
