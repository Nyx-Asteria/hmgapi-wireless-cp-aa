# The mod's CI: HMG-API's mod workflow (floor and hook points, build, tests, script check,
# packages with a throwaway key), pinned to the same HMG-API as hmgapi-sdk.json.
# Until HMG-API 1.0.3 carries the SDK, both are a HMG-API commit SHA; from 1.0.3, the
# release (@v1.0.3 here, {"version", "sha256"} there). Change them together.
name: CI

on:
  push:
    branches: [main, k5-log2-cleanup, rc7-final]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/check-pin.py

  mod:
    uses: ./.github/workflows/mod-source-floor.yml

  journal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - name: Production session journal regression
        run: python3 wireless-carplay-aa/tests/session_journal_test.py

      - name: Native session USB export regression
        run: python3 wireless-carplay-aa/tests/session_export_test.py

      - name: CPUL-derived session log policy regression
        run: |
          mkdir -p out/log-policy
          javac --release 8 -d out/log-policy wireless-carplay-aa/src/hmgapi/mods/wireless/dipo/SessionLogPolicy.java wireless-carplay-aa/src/hmgapi/mods/wireless/dipo/PreSessionEvents.java wireless-carplay-aa/tests/SessionLogPolicyTest.java
          java -cp out/log-policy hmgapi.mods.wireless.dipo.SessionLogPolicyTest

      - name: CPUL-derived directory writer regression
        run: |
          mkdir -p out/log-writer
          javac --release 8 -d out/log-writer wireless-carplay-aa/src/hmgapi/mods/wireless/dipo/SessionLogWriter.java wireless-carplay-aa/src/hmgapi/mods/wireless/dipo/SessionLogPolicy.java wireless-carplay-aa/tests/SessionLogWriterTest.java
          java -cp out/log-writer hmgapi.mods.wireless.dipo.SessionLogWriterTest

      - name: Java session export regression
        run: |
          mkdir -p out/session-export
          javac --release 8 -d out/session-export wireless-carplay-aa/src/hmgapi/mods/sessionexport/SessionExporter.java wireless-carplay-aa/tests/SessionExporterTest.java
          java -cp out/session-export hmgapi.mods.sessionexport.SessionExporterTest

      - name: StartSession native withdrawal fault injection
        run: |
          mkdir -p out/start-withdrawal
          javac --release 8 -d out/start-withdrawal wireless-carplay-aa/src/hmgapi/mods/wireless/StartWithdrawal.java wireless-carplay-aa/tests/StartWithdrawalTest.java
          java -cp out/start-withdrawal hmgapi.mods.wireless.StartWithdrawalTest

      - name: Native identity resume recovery regression
        run: |
          mkdir -p out/resume-recovery
          javac --release 8 -d out/resume-recovery wireless-carplay-aa/src/hmgapi/mods/wireless/ResumeRecovery.java wireless-carplay-aa/tests/ResumeRecoveryTest.java
          java -cp out/resume-recovery hmgapi.mods.wireless.ResumeRecoveryTest

      - name: Experimental theme archive quarantine regression
        run: |
          mkdir -p out/theme-archive
          javac --release 8 -d out/theme-archive wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeArchiveCapture.java wireless-carplay-aa/tests/ThemeArchiveCaptureTest.java
          java -cp out/theme-archive hmgapi.mods.wireless.ThemeArchiveCaptureTest

      - name: Experimental decoded theme transfer regression
        run: |
          mkdir -p out/theme-session
          javac --release 8 -d out/theme-session wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeArchiveCapture.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeTransferSession.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeQuarantineBudget.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeOpack.java wireless-carplay-aa/tests/ThemeTransferSessionTest.java
          java -cp out/theme-session hmgapi.mods.wireless.ThemeTransferSessionTest

      - name: Experimental bounded OPACK regression
        run: |
          mkdir -p out/theme-opack
          javac --release 8 -d out/theme-opack wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeArchiveCapture.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeTransferSession.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeQuarantineBudget.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeOpack.java wireless-carplay-aa/tests/ThemeOpackTest.java
          java -cp out/theme-opack hmgapi.mods.wireless.ThemeOpackTest

      - name: CPUL native ownership boundary regression
        run: python3 wireless-carplay-aa/tests/cpul_native_ownership.py

      - name: Experimental theme quarantine metadata regression
        run: |
          mkdir -p out/theme-metadata
          javac --release 8 -d out/theme-metadata wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeArchiveCapture.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeTransferSession.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeQuarantineBudget.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeOpack.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeCaptureMetadata.java wireless-carplay-aa/tests/ThemeTransferSessionTest.java wireless-carplay-aa/tests/ThemeCaptureMetadataTest.java
          java -cp out/theme-metadata hmgapi.mods.wireless.ThemeCaptureMetadataTest

      - name: Experimental persisted quarantine pair regression
        run: |
          mkdir -p out/theme-pair
          javac --release 8 -d out/theme-pair wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeArchiveCapture.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeTransferSession.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeQuarantineBudget.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeOpack.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeCaptureMetadata.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeQuarantinePair.java wireless-carplay-aa/tests/ThemeTransferSessionTest.java wireless-carplay-aa/tests/ThemeCaptureMetadataTest.java wireless-carplay-aa/tests/ThemeQuarantinePairTest.java
          java -cp out/theme-pair hmgapi.mods.wireless.ThemeQuarantinePairTest

      - name: Experimental theme quarantine admission regression
        run: |
          mkdir -p out/theme-budget
          javac --release 8 -d out/theme-budget wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeArchiveCapture.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeTransferSession.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeQuarantineBudget.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeOpack.java wireless-carplay-aa/src/hmgapi/mods/wireless/ThemeCaptureMetadata.java wireless-carplay-aa/tests/ThemeTransferSessionTest.java wireless-carplay-aa/tests/ThemeCaptureMetadataTest.java wireless-carplay-aa/tests/ThemeQuarantineBudgetTest.java
          java -cp out/theme-budget hmgapi.mods.wireless.ThemeQuarantineBudgetTest
